name: Discover dsh-plugins

on:
  schedule:
    # 每天 11:17（Asia/Shanghai），即 UTC 03:17。
    - cron: "17 3 * * *"
  workflow_dispatch:
    # 手动触发时的可选开关：勾选后对已审查仓库做全量/增量复查。
    inputs:
      force_rereview:
        description: "强制对已审查插件重新审查（FORCE_REREVIEW=1）"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  # 与 refresh-live-data 共享同一组，避免两个工作流同时写 docs/plugins.json 造成冲突。
  group: plugins-data-mutation
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run security engine tests
        run: node scripts/security-review.test.mjs

      - name: Discover and review plugins
        run: node scripts/discover-plugins.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # dispatch 勾选 force_rereview 时，对本轮所有插件强制重审。
          FORCE_REREVIEW: ${{ github.event.inputs.force_rereview == 'true' && '1' || '0' }}
          # 可选：配置后启用 LLM 深度复核（OpenAI 兼容 chat/completions），
          # 未配置时自动跳过，仅使用确定性规则 + 供应链检查。
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "没有数据变更，跳过 PR。"
            exit 0
          fi

          date="$(date -u +%F)"
          branch="discover/${date}"
          title="更新 dsh-plugin 插件汇总 (${date})"
          repo="${GITHUB_REPOSITORY}"
          owner="${GITHUB_REPOSITORY_OWNER}"

          git checkout -B "$branch"
          git add docs/plugins.json data/review-log.json README.md
          if [ -f README.en.md ]; then
            git add README.en.md
          fi
          git commit -m "chore: 更新 dsh-plugin 插件汇总 (${date})"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git push --force-with-lease origin "$branch"
          else
            git push --set-upstream origin "$branch"
          fi

          # GitHub API 偶发瞬断（如 GraphQL 网关 "Something went wrong ... D00D:..."），
          # 一次失败就 abort 会让每天的数据合并功亏一篑。统一处理：
          #   1) 优先走 REST 端点（gh pr list / gh pr merge 内部走 GraphQL，改用 gh api REST）；
          #   2) 剩余 REST 调用也包一层退避重试（最多 5 次，指数退避）。
          gh_retry() {
            local max=5 attempt=0 delay=5
            until "$@"; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge "$max" ]; then
                echo "[gh] 重试 ${attempt}/${max} 次后仍失败: $*" >&2
                return 1
              fi
              echo "[gh] 命令失败，${delay}s 后重试(${attempt}/${max}): $*" >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          # 按 head 分支查询 open PR（REST，替代走 GraphQL 的 gh pr list；head 需 URL 编码）。
          list_pr() {
            gh api "repos/${repo}/pulls?state=open&head=${owner}:${branch//\//%2F}" --jq '.[0].number // empty'
          }

          # 读取本轮静态审查的最严重 verdict：
          #   clean/approved -> 全部通过，立即 squash 合并并 dispatch Pages
          #   flagged -> warning 级提示或灰区高风险（risk_level=high 已标注供使用者判断），仍自动合并
          #   blocked -> 确定恶意，脚本已移出 plugins.json（不会进入公开列表），故剩余数据安全，同样自动合并；
          #              人工可在 review-log 中跟进已拦下的插件。
          worst="clean"
          if [ -f data/run-summary.json ]; then
            worst="$(jq -r '.worst_verdict // "clean"' data/run-summary.json)"
          fi
          echo "本轮 worst_verdict=${worst}"

          if [ "$worst" = "blocked" ]; then
            note="本次静态审查发现 critical 级问题（详见 data/review-log.json）。被阻断插件已移出公开列表，不会出现在 plugins.json；其余数据已自动合并。"
          elif [ "$worst" = "flagged" ]; then
            note="本轮部分插件触发 warning 级安全/隐私提示（已在列表中标注），已自动合并。"
          else
            note="本轮新审查全部通过静态安全审查：\`${worst}\`。已自动合并。"
          fi

          # 复用同分支已存在的 PR，或创建新 PR（gh pr create 走 REST；失败容忍，以查询结果为准）。
          pr_number="$(gh_retry list_pr)"
          if [ -z "$pr_number" ]; then
            gh pr create --base main --head "$branch" --title "$title" --body "Pending merge verdict..." >/dev/null || \
              echo "[warn] gh pr create 未成功（可能已存在同分支 PR），改以查询结果为准。"
            pr_number="$(gh_retry list_pr)"
          fi
          if [ -z "$pr_number" ]; then
            echo "ERROR: 无法创建或定位 PR（branch=${branch}）" >&2
            exit 1
          fi
          echo "PR: https://github.com/${repo}/pull/${pr_number}"

          # 合并前更新 PR 标题/描述（REST PATCH，避免 edit 已合并/关闭的 PR）。
          gh_retry gh api -X PATCH "repos/${repo}/pulls/${pr_number}" \
            -f "title=${title}" \
            -f "body=自动检索 GitHub \`dsh-plugin\` 话题并完成静态安全审查后生成。${note}" >/dev/null

          # 立即 squash 合并（REST PUT，规避 gh pr merge 的 GraphQL 突变偶发失败）。
          if gh_retry gh api -X PUT "repos/${repo}/pulls/${pr_number}/merge" \
            -f "merge_method=squash" \
            -f "commit_title=chore: 更新 dsh-plugin 插件汇总 (${date}) (#${pr_number})" >/dev/null; then
            echo "PR #${pr_number} 已 squash 合并。"
          else
            # 极端情况：合并实际成功但响应在传输层丢失，查询状态后容忍。
            merged="$(gh api "repos/${repo}/pulls/${pr_number}" --jq '.merged' 2>/dev/null || true)"
            if [ "$merged" = "true" ]; then
              echo "[warn] 合并请求响应丢失，但确认 PR #${pr_number} 已合并。"
            else
              echo "ERROR: PR #${pr_number} 合并失败（当前状态: $(gh api "repos/${repo}/pulls/${pr_number}" --jq '.state' 2>/dev/null || echo unknown)）" >&2
              exit 1
            fi
          fi

          # 删除已合并分支（仓库若开启自动删除则已不存在，忽略 404/422）。
          gh api -X DELETE "repos/${repo}/git/refs/heads/${branch}" >/dev/null 2>&1 || \
            echo "[warn] 分支 ${branch} 删除失败或已不存在（不影响合并结果）。"

          # GITHUB_TOKEN 的 push 不递归触发其它 workflow 的 push 事件，故合并后主动 dispatch Pages。
          gh workflow run deploy-pages.yml || echo "[warn] dispatch deploy-pages 失败,数据已合并到 main,下次手动触发即可。"