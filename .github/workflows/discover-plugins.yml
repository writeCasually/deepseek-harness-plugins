name: Discover dsh-plugins

on:
  schedule:
    # 每天 11:17（Asia/Shanghai），即 UTC 03:17。
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  # 与 refresh-live-data 共享同一组，避免两个工作流同时写 docs/plugins.json 造成冲突。
  group: plugins-data-mutation
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover and review plugins
        run: node scripts/discover-plugins.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "没有数据变更，跳过 PR。"
            exit 0
          fi

          date="$(date -u +%F)"
          branch="discover/${date}"
          title="更新 dsh-plugin 插件汇总 (${date})"

          git checkout -B "$branch"
          git add docs/plugins.json data/review-log.json README.md
          if [ -f README.en.md ]; then
            git add README.en.md
          fi
          git commit -m "chore: 更新 dsh-plugin 插件汇总 (${date})"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git push --force-with-lease origin "$branch"
          else
            git push --set-upstream origin "$branch"
          fi

          existing="$(gh pr list --head "$branch" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            pr_number="$existing"
          else
            gh pr create --base main --head "$branch" --title "$title" --body "Pending merge verdict..."
            pr_number="$(gh pr list --head "$branch" --json number --jq '.[0].number')"
          fi

          # 读取本轮静态审查的最严重 verdict：
          #   clean/approved -> 全部通过，立即 squash 合并并 dispatch Pages
          #   flagged -> warning 级提示（列表已标注安全/隐私提示），仍自动合并
          #   blocked -> critical 级发现（恶意插件不会被写入 plugins.json），保留人工复核
          worst="clean"
          if [ -f data/run-summary.json ]; then
            worst="$(jq -r '.worst_verdict // "clean"' data/run-summary.json)"
          fi
          echo "本轮 worst_verdict=${worst}"

          if [ "$worst" = "blocked" ]; then
            note="本次静态审查发现 critical 级问题（详见 data/review-log.json），保留人工复核后合并。"
            # 仅更新 PR 描述，不自动合并。
            gh pr edit "$pr_number" --title "$title" --body "自动检索 GitHub \`dsh-plugin\` 话题并完成静态安全审查后生成。${note}"
          else
            if [ "$worst" = "flagged" ]; then
              note="本轮部分插件触发 warning 级安全/隐私提示（已在列表中标注），已自动合并。"
            else
              note="本轮新审查全部通过静态安全审查：\`${worst}\`。已自动合并。"
            fi
            # 在合并前更新 PR 描述，避免 edit 已合并/关闭的 PR。
            gh pr edit "$pr_number" --title "$title" --body "自动检索 GitHub \`dsh-plugin\` 话题并完成静态安全审查后生成。${note}"
            # 与 refresh-live-data 一致：立即 squash 合并（不走 auto-merge 开关，无需仓库另开设置）。
            gh pr merge "$pr_number" --squash --delete-branch
            # GITHUB_TOKEN 的 push 不递归触发其它 workflow 的 push 事件，故合并后主动 dispatch Pages。
            gh workflow run deploy-pages.yml || echo "[warn] dispatch deploy-pages 失败,数据已合并到 main,下次手动触发即可。"
          fi
