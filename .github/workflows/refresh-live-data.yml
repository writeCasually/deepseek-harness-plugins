name: Refresh live data

on:
  schedule:
    # 每 2 小时刷新一次插件实时数据（UTC，北京时间 +8）。
    - cron: "7 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  # 与 discover-plugins 共享同一组，避免两个工作流同时写 docs/plugins.json 造成冲突。
  group: plugins-data-mutation
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh live data
        run: node scripts/refresh-live-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open pull request
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "无实时数据变更，跳过提交。"
            exit 0
          fi

          date="$(date -u +%F)"
          branch="refresh/${date}"
          title="刷新插件实时数据 (${date})"
          body="自动刷新插件 stars/forks/issues/watchers/pushed_at/archived 等实时数据，并重新生成 README。"

          git checkout -B "$branch"
          git add docs/plugins.json README.md README.en.md
          git commit -m "chore: 刷新插件实时数据 ($(date -u +%FT%TZ))"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git push --force-with-lease origin "$branch"
          else
            git push --set-upstream origin "$branch"
          fi

          existing="$(gh pr list --head "$branch" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            pr_number="$existing"
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
            pr_number="$(gh pr list --head "$branch" --json number --jq '.[0].number')"
          fi

          # 分支保护要求通过 PR 提交(0 审批、无必需检查),bot 凭 GITHUB_TOKEN 即可自合。
          # 仅此 workflow 自动合并,discover-plugins 的新插件 PR 仍走人工复核。
          gh pr merge "$pr_number" --squash --delete-branch

          # GITHUB_TOKEN 的 push 不会触发其它 workflow 的 push 事件,
          # 故主动 dispatch Pages 部署使刷新数据上线。
          gh workflow run deploy-pages.yml || echo "[warn] dispatch deploy-pages 失败,数据已合并到 main,下次手动触发即可。"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
